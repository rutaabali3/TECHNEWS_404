name: Update TechCrunch summaries

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: techcrunch-updater
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Validate Groq secret format
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BAI_API_KEY_1: ${{ secrets.BAI_API_KEY_1 }}
        run: |
          count=0
          if [ -n "$(printf '%s' "$BAI_API_KEY_1" | tr -d '[:space:]')" ]; then
            echo "BAI_API_KEY_1 is present."
            count=$((count + 1))
          fi
          for name in GROQ_API_KEY_1 GROQ_API_KEY_2 GROQ_API_KEY_3 GROQ_API_KEY_4 GROQ_API_KEY_5; do
            value="${!name}"
            if [ -n "$(printf '%s' "$value" | tr -d '[:space:]')" ]; then
              case "$(printf '%s' "$value" | tr -d '[:space:]')" in
                gsk_*) count=$((count + 1)); echo "$name is present and has the expected format." ;;
                *) echo "$name is present but does not have the expected Groq key format."; exit 1 ;;
              esac
            fi
          done
          if [ "$count" -eq 0 ]; then
            legacy=$(printf '%s' "$GROQ_API_KEY" | tr -d '[:space:]')
            case "$legacy" in
              gsk_*) count=1; echo "Legacy GROQ_API_KEY is present; use GROQ_API_KEY_1 through GROQ_API_KEY_5 for multi-key rotation." ;;
              *) echo "Add at least one Groq secret: GROQ_API_KEY_1 through GROQ_API_KEY_5."; exit 1 ;;
            esac
          fi
          echo "$count numbered/legacy Groq key(s) configured."

      - name: Fetch and summarize new posts
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BAI_API_KEY_1: ${{ secrets.BAI_API_KEY_1 }}
          GROQ_MODEL: openai/gpt-oss-120b
          BAI_MODEL: deepseek-v4-flash
        run: python scripts/update_posts.py

      - name: Commit updated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          if git diff --cached --quiet; then
            echo "No new articles found."
          else
            git commit -m "Update TechCrunch summaries"
            git push
          fi

  deploy-pages:
    needs: update-posts
    if: ${{ needs.update-posts.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out updated repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
