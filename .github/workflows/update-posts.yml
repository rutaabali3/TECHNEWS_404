name: Update TechCrunch summaries

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Validate Groq secret format
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          KEY=$(printf '%s' "$GROQ_API_KEY" | tr -d '[:space:]')
          if [ -z "$KEY" ]; then
            echo "GROQ_API_KEY is missing."
            exit 1
          fi
          case "$KEY" in
            gsk_*) echo "Groq secret is present and has the expected format." ;;
            *) echo "GROQ_API_KEY is present but does not have the expected Groq key format."; exit 1 ;;
          esac

      - name: Fetch and summarize new posts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: python scripts/update_posts.py

      - name: Commit updated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          if git diff --cached --quiet; then
            echo "No new articles found."
          else
            git commit -m "Update TechCrunch summaries"
            git push
          fi

  deploy-pages:
    needs: update-posts
    if: ${{ needs.update-posts.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out updated repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
